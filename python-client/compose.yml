services:
  python-app:
    image: python:3.12-slim
    container_name: python312-container
    working_dir: /code
    volumes:
      - ./code:/code
      - ./requirements.txt:/code/requirements.txt
    command: >
      sh -c "pip install --upgrade pip &&
             pip install --no-cache-dir --root-user-action=ignore -r requirements.txt &&
             python main.py"
    networks:
      - clickhouse-net

networks:
  clickhouse-net:
    external: true
