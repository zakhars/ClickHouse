services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-md-svr
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DB: marketdata
    volumes:
      - ./data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - clickhouse-net

networks:
  clickhouse-net:
    name: clickhouse-net
    driver: bridge